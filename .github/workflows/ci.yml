name: uFlipper CI
on:
  push:
    branches: [dev, main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uflipper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libsqlite3-dev pkg-config
      - name: Dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install libsodium pkg-config
      - name: Pinned nanopb for native development probes
        run: git submodule update --init 3rdparty/nanopb
      - run: cmake -S workbench -B build-core -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build-core --parallel 2
      - run: ctest --test-dir build-core --output-on-failure --no-tests=error --output-junit core-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-results-${{ matrix.os }}
          path: build-core/core-results.xml
          retention-days: 14
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - os: macos-15-intel
            qt_host: mac
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libusb-1.0-0-dev zlib1g-dev libsodium-dev libsqlite3-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libegl1 libopengl0 libfuse2 patchelf
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config autoconf automake libtool
          bash scripts/ci/macos_dependencies.sh "$RUNNER_TEMP/uflipper-deps"
          printf 'PKG_CONFIG_PATH=%s/universal/lib/pkgconfig\n' "$RUNNER_TEMP/uflipper-deps" >> "$GITHUB_ENV"
      - name: Install prebuilt Qt 6.8.3
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt ${{ matrix.qt_host }} desktop 6.8.3 ${{ matrix.qt_arch }} -O "$RUNNER_TEMP/Qt" -m qtserialport qt5compat qtshadertools
          python3 -c 'import pathlib,sys; print(next(pathlib.Path(sys.argv[1]).rglob("qmake")).parent)' "$RUNNER_TEMP/Qt/6.8.3" >> "$GITHUB_PATH"
      - name: Compile new integration paths before the full build
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/probe-compile" "$RUNNER_TEMP/telemetry-compile"
          cd "$RUNNER_TEMP/probe-compile"
          qmake "$GITHUB_WORKSPACE/workbench/device-probe/device-probe.pro"
          make -j2 main.o
          cd "$RUNNER_TEMP/telemetry-compile"
          qmake "$GITHUB_WORKSPACE/backend/backend.pro"
          make -j2 devicetelemetry.o powersnapshot.o
      - name: Build macOS Universal
        if: runner.os == 'macOS'
        run: bash build_mac.sh
      - name: Build Linux application
        if: runner.os == 'Linux'
        run: bash build_linux.sh
      - name: App-RPC contract tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then desktop_build="$GITHUB_WORKSPACE/build_mac"; else desktop_build="$GITHUB_WORKSPACE/build"; fi
          mkdir -p "$RUNNER_TEMP/protocol-tests"
          cd "$RUNNER_TEMP/protocol-tests"
          qmake "$GITHUB_WORKSPACE/tests/qt/protocol_tests.pro" "BACKEND_BUILD=$desktop_build/backend"
          make -j2
          plugin=$(python3 -c 'import pathlib,sys; print(next(p for p in pathlib.Path(sys.argv[1]).glob("*flipperproto0*") if p.suffix in (".so", ".dylib")))' "$desktop_build/plugins")
          ./uflipper_protocol_tests "$plugin"
      - name: Native application startup on Linux
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: timeout 15 build/uFlipper --smoke-test
      - name: Native bundled application startup on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, subprocess
          sdk = pathlib.Path(os.environ["RUNNER_TEMP"]) / "Qt"
          hidden = sdk.with_name("Qt-hidden-during-runtime-test")
          sdk.rename(hidden)
          try:
              env = os.environ.copy()
              for key in ("QT_PLUGIN_PATH", "QML_IMPORT_PATH", "QML2_IMPORT_PATH", "DYLD_FRAMEWORK_PATH", "DYLD_LIBRARY_PATH"):
                  env.pop(key, None)
              subprocess.run(["build_mac/uFlipper.app/Contents/MacOS/uFlipper", "--smoke-test"], env=env, timeout=20, check=True)
          finally:
              hidden.rename(sdk)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: uFlipper-${{ matrix.os }}-test-build
          path: |
            build_mac/uFlipper.dmg
            build_mac/uFlipper.app.zip
            build/uFlipper-linux-test.tar.gz
          if-no-files-found: error
          retention-days: 14
