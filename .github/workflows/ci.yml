name: uFlipper CI
on:
  push:
    branches: [dev, main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uflipper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libsqlite3-dev pkg-config
      - name: Dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install libsodium pkg-config
      - run: cmake -S workbench -B build-core -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build-core --parallel 2
      - run: ctest --test-dir build-core --output-on-failure --output-junit core-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-results-${{ matrix.os }}
          path: build-core/core-results.xml
          retention-days: 14
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - os: macos-15
            qt_host: mac
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libusb-1.0-0-dev zlib1g-dev libsodium-dev libsqlite3-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libegl1 libopengl0 libfuse2 patchelf
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config autoconf automake libtool
          bash scripts/ci/macos_dependencies.sh "$RUNNER_TEMP/uflipper-deps"
          printf 'PKG_CONFIG_PATH=%s/universal/lib/pkgconfig\n' "$RUNNER_TEMP/uflipper-deps" >> "$GITHUB_ENV"
      - name: Install prebuilt Qt 6.8.3
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt ${{ matrix.qt_host }} desktop 6.8.3 ${{ matrix.qt_arch }} -O "$RUNNER_TEMP/Qt" -m qtserialport qt5compat qtshadertools
          python3 -c 'import pathlib,sys; print(next(pathlib.Path(sys.argv[1]).rglob("qmake")).parent)' "$RUNNER_TEMP/Qt/6.8.3" >> "$GITHUB_PATH"
      - name: Build macOS Universal
        if: runner.os == 'macOS'
        run: bash build_mac.sh
      - name: Build Linux application
        if: runner.os == 'Linux'
        run: bash build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: uFlipper-${{ matrix.os }}-test-build
          path: |
            build_mac/uFlipper.dmg
            build_mac/uFlipper.app.zip
            build/uFlipper-linux-test.tar.gz
          if-no-files-found: error
          retention-days: 14
